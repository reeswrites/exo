# Copy to wrangler.toml and fill in. The real file is gitignored: the database
# id, the bucket names and the owner's details belong to one instance, not to
# the engine.

name = "exo-read-surface"
main = "src/index.js"
compatibility_date = "2026-08-18"

# The tabular projection — one table per served zone, reconciled to the bundle
# on every import, so tightening serve-manifest.json actually drops tables.
[[d1_databases]]
binding = "DB"
database_name = "exo"
database_id = "PUT-THE-ID-WRANGLER-PRINTED-HERE"

# vectors.f32 (384 floats per row, loaded whole into the isolate), vectors.json,
# and brief.md.
[[r2_buckets]]
binding = "VECTORS"
bucket_name = "exo-vectors"

# bge-small-en-v1.5 — the SAME model that produced the stored vectors, so query
# and corpus share a space. This binding is why Cloudflare rather than a box you
# rent: it removes the model from the deployment artifact entirely.
[ai]
binding = "AI"

# Who this deployment is about. The engine's source names nobody, so these are
# what put the owner back into the served text.
#
# BLOG_URL_TEMPLATE is the one that is not cosmetic: without it a post hit
# carries no `url` at all, and the right answer about a published post is the
# link rather than a paraphrase. Leave it out only if you publish nothing.
[vars]
OWNER_NAME = "Ada Lovelace"
OWNER_LABEL = "ada"
BLOG_URL_TEMPLATE = "https://example.com/posts/{slug}/"

# AUTH_TOKEN is a secret, never a var:
#   openssl rand -hex 32 | npx wrangler secret put AUTH_TOKEN

# ---------------------------------------------------------------------------
# The second door (ADR-0021). Everything below is OPTIONAL. Leave it out and
# this is the bearer-header surface it has always been: one secret, one header,
# no store. Uncomment it to also accept OAuth at /mcp, which is the only way
# claude.ai, ChatGPT and other hosted assistants can reach an MCP server.
#
#   npx wrangler kv namespace create OAUTH_KV
#   npx wrangler d1 execute exo --remote --file migrations/0002-which-door.sql
#
# The BINDING'S PRESENCE is the feature flag — there is no enable switch. No
# namespace means no /authorize, no discovery documents and no /mcp.
#
# Rotating AUTH_TOKEN must also empty this namespace. A grant outlives the
# secret that authorised it, so a rotation that leaves grants in place retires
# the password and not the access.
# ---------------------------------------------------------------------------
# [[kv_namespaces]]
# binding = "OAUTH_KV"
# id = "PUT-THE-ID-WRANGLER-PRINTED-HERE"

# Required for Client ID Metadata Documents, which is how Claude identifies
# itself without you pasting a client id anywhere. The provider will not
# advertise CIMD without this flag, because resolving a client id means fetching
# a URL the client chose and that fetch must not reach anything private. Safe
# here: this Worker reaches its data through bindings and never calls fetch().
# compatibility_flags = ["global_fetch_strictly_public"]

# Dynamic client registration is OFF unless this says "true". An open /register
# is an unauthenticated write endpoint; CIMD covers the clients that matter
# without one. Turn it on for a client that supports neither CIMD nor a
# pre-registered pair — and for test/oauth-flow.mjs, which needs to register.
# [vars]
# OAUTH_ALLOW_DCR = "false"

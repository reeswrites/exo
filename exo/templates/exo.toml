# Your instance. Copy to exo.toml beside your record and edit.
#
# Relative paths resolve against EXO_HOME (the directory holding this file);
# `~` expands. An environment variable of the same name (EXO_EXPORTS,
# EXO_UPSTREAM_VAULT, …) wins over the file, so CI can repoint a path without
# editing anything the laptop owns.

[owner]
# Who the record is about. `name` and `possessive` are prose, used by the brief.
name = "Ada Lovelace"
possessive = "her"
# `voice` is the attribution label on any span you wrote yourself, and it is
# STORED IN EVERY ATOM'S ID. Choose it once. Changing it later re-mints the
# whole derived tier and every reader will see a life's worth of "new" rows.
voice = "ada"

[blog]
# Only if you publish. {slug} is substituted with each post's frontmatter slug —
# whatever your site actually resolves permalinks against. Leave the whole
# section out and post rows simply carry no url.
url_template = "https://example.com/posts/{slug}/"

[paths]
# Where this instance physically keeps its inputs. The defaults shown are what
# `exo init` creates; everything under raw/ is gitignored.
exports           = "raw/exports"            # Last.fm / Letterboxd / Goodreads / Untappd dumps
posts             = "raw/posts"              # a mirror of your published markdown
vault             = "raw/vault"              # a mirror of your notes
drafts            = "raw/drafts"
procedures        = "procedures"           # hand-written methods; NOT under raw/, nothing mirrors them
inventory         = "raw/inventory"          # collections: records, books, games
projects_snapshot = "raw/projects.json"      # written by `exo scan-projects`
downloads         = "~/Downloads"            # where chat exports land before import

[upstream]
# Sources another system owns, which `exo sync-raw` mirrors into [paths] above
# with rsync --delete. Omit any you do not have: an unconfigured upstream is
# skipped, and a configured-but-absent one is skipped too, because a viewer must
# never be able to fail an ingest.
posts = "/path/to/your-blog/_posts"
vault = "/path/to/your-notes"

[notes.sources]
# Where notes come FROM (ADR-0017). Each key is an adapter — `apple`, `files`,
# `notion`, or one your plugins add — and each value is what to point it at. The
# one that needs no argument (Apple Notes reads a fixed local database) takes "".
#
# Bare `exo ingest-notes` runs every source listed here. Naming one runs just it:
#   exo ingest-notes notion                          the API
#   exo ingest-notes notion --from ~/Export-1a2b.zip an export, offline
#
# `notion = ""` means the API, which needs NOTION_TOKEN in
# ~/.config/exo/secrets/env and the integration connected to the pages you want
# held. That connection IS the privacy boundary on Notion's side: what you did
# not connect, Exo cannot see. Point it at an export instead if you would rather
# it never talk to Notion at all.
#
# Notes land in notes/raw/<source>/, and each landing directory needs its own
# decision in serve-manifest.json's path_zones before anything will publish. That
# is deliberate: a new source is a new question about what leaves this machine,
# and it is not answered by a decision made about a different one.
notion = ""
files  = "~/writing"

[vault]
# Folders whose notes are ABOUT you by default, before first-person density
# flips an individual span. Stored in every atom's facet, so it is in the id:
# set it once, like owner.voice.
about_me_folders = ["Journal"]

[projects]
# The workshop (ADR-0011): your own repos, as a source.
root      = "~/code"
deny      = ["node_modules"]   # not a privacy list — dirs holding no authored work
max_depth = 2

[tools]
# Which of the engine's tools this instance offers (ADR-0020). Both lines are
# optional, and an instance that sets neither offers everything.
#
# This is NOT a privacy control. What may leave is decided by
# serve-manifest.json and enforced by physical omission from the projection — a
# held zone is not on the box, so a tool reaching for it finds nothing whether or
# not it was advertised. These two lines decide what is worth CALLING.
#
# A tool whose zones are held is dropped automatically; neither line is needed
# for that. Reach for these when the zone is served and you still want the tool
# gone — almost always because something else you connect answers it better.
#
# domains: keep only these (ADR-0015's facet). Tools marked "*" are
#          parameterised over the surface rather than part of it and always
#          survive. Omit or leave empty for every domain.
# disable: switch off by name. A name no tool answers to is an error, not a
#          no-op — silently offering the tool you decided against is the one
#          outcome a deny-list must never produce.
# domains = ["mind", "workshop"]
# disable = ["recipes"]

[peers]
# Sources that a system you also connect serves LIVE (ADR-0020).
#
# Keyed on the note `source` — the string the adapter stamps on every row it
# lands, so `notion` here means notes ingested by `exo ingest-notes notion`.
# Rows carrying a peered source come back with their `uuid`, the id the note has
# in that system, so an assistant holding both can tell one note from two.
#
# Declaring a peer does not withhold anything. This surface is the filed,
# indexed, publication-graded copy; the peer is the current one. Which to use is
# the agent's call, and it needs the fact stated to make it.
# sources = { notion = "Notion" }
